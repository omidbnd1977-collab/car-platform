# تنظیمات دیپلوی روی Render (Blueprint).
# این فایل فقط زمانی استفاده می‌شود که سرویس‌ها را به‌صورت Blueprint
# بسازید؛ سرویس‌هایی که حالا به‌صورت دستی ساخته شده‌اند را تغییر نمی‌دهد
# و صرفاً مستند تنظیمات درست است.
services:
  # ------------------------------------------------------------
  # Backend (Node / Express)
  # ------------------------------------------------------------
  - type: web
    name: car-platform-db
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "5000"
      - key: JWT_SECRET
        sync: false
      - key: SEARCHAPI_KEY
        sync: false
      # یا فقط DATABASE_URL را ست کنید (هر دو پشتیبانی می‌شود)
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # محل ذخیره‌ی فایل‌های آپلودی (backend/src/services/storageService.js).
      # خالی یا local یعنی دیسک موقت سرویس؛ روی Render فایل‌های این دیسک با
      # هر دیپلوی/ری‌استارت پاک می‌شوند، پس برای ماندگاری عکس‌ها یک باکت
      # S3 یا Cloudflare R2 بسازید و مقادیر زیر را پر کنید
      # (S3_PUBLIC_BASE_URL برای R2 الزامی است).
      - key: STORAGE_PROVIDER
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
        secret: true
      - key: S3_SECRET_ACCESS_KEY
        sync: false
        secret: true
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: S3_KEY_PREFIX
        sync: false
      # ------------------------------------------------------------
      # محافظ روت‌های نوشتنی (backend/src/middleware/adminGuard.js)
      # ------------------------------------------------------------
      # تا وقتی این متغیر ست نشود، POST/PUT/DELETEهای /api/cars،
      # /api/catalog/brands، /api/catalog/models و POST /api/dealerships
      # برای همه باز است (پنل ادمین هم رمز نمی‌خواهد). با ست‌کردن یک
      # رشته‌ی طولانی، همان روت‌ها به هدر x-admin-key یا توکن ادمین
      # نیازمند می‌شوند و پنل /admin از کاربر رمز می‌پرسد.
      # GETها (لیست خودروها و کاتالوگ) عمداً باز می‌مانند.
      - key: ADMIN_API_KEY
        sync: false
        secret: true

  # ------------------------------------------------------------
  # Frontend (Static site / Vite)
  # ------------------------------------------------------------
  - type: web
    name: car-platform
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # برای SPA بودن سایت: همه‌ی مسیرها به index.html برمی‌گردند
    # (فایل public/_redirects مخصوص Netlify است و روی Render کار نمی‌کند)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://car-platform-db.onrender.com/api
      # slug مشتری/قالب این سرویس (frontend/src/config/tenants/*).
      # خالی = qeshm (پیش‌فرض). راهنما: docs/tenants.md
      - key: VITE_TENANT
        sync: false
