name: Import Render PostgreSQL backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Write backup to temporary file
        env:
          DB_DUMP: ${{ secrets.DB_DUMP }}
        run: |
          umask 077
          printf '%s' "$DB_DUMP" > /tmp/car-platform.sql
          test -s /tmp/car-platform.sql

      - name: Import into Render
        env:
          RENDER_DB_URL: ${{ secrets.RENDER_DB_URL }}
        run: |
          test -n "$RENDER_DB_URL"
          psql "$RENDER_DB_URL" -v ON_ERROR_STOP=1 -f /tmp/car-platform.sql

      - name: Verify tables
        env:
          RENDER_DB_URL: ${{ secrets.RENDER_DB_URL }}
        run: |
          psql "$RENDER_DB_URL" -v ON_ERROR_STOP=1 -tAc "SELECT to_regclass('public.cars'), to_regclass('public.car_brands'), to_regclass('public.car_models'), to_regclass('public.dealerships');"

      - name: Remove temporary backup
        if: always()
        run: rm -f /tmp/car-platform.sql
