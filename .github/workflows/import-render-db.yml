name: Inspect Render PostgreSQL database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Check Render database
        env:
          RENDER_DB_URL: ${{ secrets.RENDER_DB_URL }}
        run: |
          test -n "$RENDER_DB_URL"

          echo "=== TABLES ==="
          psql "$RENDER_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -c "\dt public.*"

          echo "=== IMPORTANT TABLES ==="
          psql "$RENDER_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -c "
              SELECT
                to_regclass('public.car_brands') AS car_brands,
                to_regclass('public.car_models') AS car_models,
                to_regclass('public.cars') AS cars,
                to_regclass('public.dealerships') AS dealerships;
            "

          echo "=== ROW COUNTS ==="
          psql "$RENDER_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -c "
              SELECT 'car_brands' AS table_name, count(*) AS rows
              FROM public.car_brands
              UNION ALL
              SELECT 'car_models', count(*)
              FROM public.car_models
              UNION ALL
              SELECT 'cars', count(*)
              FROM public.cars
              UNION ALL
              SELECT 'dealerships', count(*)
              FROM public.dealerships;
            "
