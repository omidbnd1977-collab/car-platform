name: Import Render PostgreSQL backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Import database backup
        env:
          RENDER_DB_URL: ${{ secrets.RENDER_DB_URL }}
          DB_DUMP: ${{ secrets.DB_DUMP }}
        shell: bash
        run: |
          set -e

          test -n "$RENDER_DB_URL"
          test -n "$DB_DUMP"

          printf '%s' "$DB_DUMP" | base64 -d > /tmp/car-platform.sql

          psql "$RENDER_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -f /tmp/car-platform.sql
