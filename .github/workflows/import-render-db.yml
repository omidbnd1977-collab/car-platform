name: Verify Render PostgreSQL database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify database
        env:
          RENDER_DB_URL: ${{ secrets.RENDER_DB_URL }}
        run: |
          set -e

          echo "=== TABLES ==="
          psql "$RENDER_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -c "\dt public.*"

          echo "=== ROW COUNTS ==="
          psql "$RENDER_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -c "
              SELECT 'car_brands' AS table_name, count(*) AS rows
              FROM public.car_brands
              UNION ALL
              SELECT 'car_models', count(*)
              FROM public.car_models
              UNION ALL
              SELECT 'cars', count(*)
              FROM public.cars
              UNION ALL
              SELECT 'dealerships', count(*)
              FROM public.dealerships;
            "
            
          echo "=== CAR IMAGES ==="
          psql "$RENDER_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -c "
              SELECT
                id,
                car_id,
                image_url,
                view_type,
                approval_status
              FROM public.car_images
              ORDER BY id;
            "
